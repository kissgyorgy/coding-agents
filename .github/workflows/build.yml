name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  aarch64-darwin:
    name: Build aarch64-darwin packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake
        run: nix flake check --all-systems --print-build-logs

      - name: Build packages
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-darwin --apply builtins.attrNames | jq -r '.[]')
          for package in $packages; do
            echo "::group::Building $package"
            nix build --print-build-logs --no-link ".#packages.aarch64-darwin.$package"
            echo "::endgroup::"
          done

      - name: Smoke test packages
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-darwin --apply builtins.attrNames | jq -r '.[]')
          for package in $packages; do
            echo "::group::Testing $package"
            out=$(nix build --no-link --print-out-paths ".#packages.aarch64-darwin.$package")
            mainProgram=$(nix eval --raw ".#packages.aarch64-darwin.$package.meta.mainProgram")
            echo "$out/bin/$mainProgram --help"
            "$out/bin/$mainProgram" --help
            echo "::endgroup::"
          done

  x86_64-linux-cache:
    name: Build and cache x86_64-linux packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: coding-agents
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Build and push to cachix
        run: scripts/build-and-cache.sh
