name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  aarch64-linux:
    name: Build aarch64-linux packages
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake
        run: nix flake check --all-systems --print-build-logs

      - name: Build packages
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-linux --apply builtins.attrNames | jq -r '.[]')
          for package in $packages; do
            echo "::group::Building $package"
            nix build --print-build-logs --no-link ".#packages.aarch64-linux.$package"
            echo "::endgroup::"
          done

      - name: Smoke test packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-linux --apply builtins.attrNames | jq -r '.[]')
          # Packages that can't be smoke tested with --help (hang or need GPU/TTY)
          skip_run_test="llmserve vibe-kanban"
          failed=()
          for package in $packages; do
            echo "::group::Testing $package"
            if out=$(nix build --no-link --print-out-paths ".#packages.aarch64-linux.$package" 2>&1); then
              mainProgram=$(nix eval --raw ".#packages.aarch64-linux.$package.meta.mainProgram")
              binary="$out/bin/$mainProgram"
              if [[ " $skip_run_test " =~ " $package " ]]; then
                # Just verify binary exists
                if [ -x "$binary" ]; then
                  echo "$package: binary exists at $binary"
                  echo "::endgroup::"
                else
                  echo "::error::$package binary not found"
                  failed+=("$package")
                  echo "::endgroup::"
                fi
              else
                # Run --help
                echo "$binary --help"
                if timeout 10s "$binary" --help 2>&1; then
                  echo "::endgroup::"
                else
                  echo "::warning::$package --help failed"
                  failed+=("$package")
                  echo "::endgroup::"
                fi
              fi
            else
              echo "::error::$package build failed"
              failed+=("$package")
              echo "::endgroup::"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::Packages with test failures: ${failed[*]}"
          fi

  aarch64-darwin:
    name: Build aarch64-darwin packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake
        run: nix flake check --all-systems --print-build-logs

      - name: Build packages
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-darwin --apply builtins.attrNames | jq -r '.[]')
          for package in $packages; do
            echo "::group::Building $package"
            nix build --print-build-logs --no-link ".#packages.aarch64-darwin.$package"
            echo "::endgroup::"
          done

      - name: Smoke test packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.aarch64-darwin --apply builtins.attrNames | jq -r '.[]')
          failed=()
          for package in $packages; do
            echo "::group::Testing $package"
            if out=$(nix build --no-link --print-out-paths ".#packages.aarch64-darwin.$package" 2>&1); then
              mainProgram=$(nix eval --raw ".#packages.aarch64-darwin.$package.meta.mainProgram")
              binary="$out/bin/$mainProgram"
              echo "$binary --help"
              if "$binary" --help 2>&1; then
                echo "::endgroup::"
              else
                echo "::warning::$package --help failed"
                failed+=("$package")
                echo "::endgroup::"
              fi
            else
              echo "::error::$package build failed"
              failed+=("$package")
              echo "::endgroup::"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::Packages with test failures: ${failed[*]}"
          fi
